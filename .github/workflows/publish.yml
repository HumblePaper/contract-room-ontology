name: publish
on:
  push:
    branches: [main]
    # The README commit below is pushed with a PAT, which does start workflows; a README-only push must not publish again.
    paths-ignore: ['README.md']
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  data-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # README_PUSH_TOKEN is the founder's fine-grained PAT (an admin, so it can push past branch protection);
      # without it the push falls back to GITHUB_TOKEN, which protection on main rejects.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.README_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: regenerate the README on main
        run: |
          npm run readme
          if ! git diff --quiet README.md; then
            git config user.name "contract-room-publish"
            git config user.email "contract-room-publish@users.noreply.github.com"
            git add README.md
            git commit -m "README: regenerate tables and date"
            git push origin HEAD:main
          fi
      - run: npm run build
      - run: (cd build && zip -qr jsonld.zip jsonld)
      - name: rolling data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Data (rolling)" --notes "Rebuilt on every merge to main. CC BY 4.0, attribution: The Contract Room, https://thecontractroom.com" --latest=false
          gh release upload data build/graph.ttl build/vocab.ttl build/graph.json build/search.json build/jsonld.zip --clobber
          gh release edit data --notes "Rebuilt from ${{ github.sha }} on $(date -u +%Y-%m-%d). CC BY 4.0, attribution: The Contract Room, https://thecontractroom.com"
  dispatch:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: tell the site to publish
        env:
          DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vivekdurai/thecontractroom/dispatches \
            -d '{"event_type":"reference-publish","client_payload":{"sha":"${{ github.sha }}"}}'
