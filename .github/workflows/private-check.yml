name: private-check
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # Best-effort: the dispatch token is scoped to the site repo, so this may 403; the site posts the final status.
      - name: mark pending
        run: |
          curl -sf -X POST -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -d '{"state":"pending","context":"private-check","description":"Queued"}' || true
      - name: dispatch to the site
        run: |
          curl -sf -X POST -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vivekdurai/thecontractroom/dispatches \
            -d '{"event_type":"reference-pr","client_payload":{"sha":"${{ github.event.pull_request.head.sha }}","pr":${{ github.event.pull_request.number }}}}'
