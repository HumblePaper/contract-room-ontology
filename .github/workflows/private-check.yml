name: private-check
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # The site runs the full validation and posts the private-check status on this pull request.
      - name: dispatch to the site
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vivekdurai/thecontractroom/dispatches \
            -d "{\"event_type\":\"reference-pr\",\"client_payload\":{\"sha\":\"$SHA\",\"base\":\"$BASE\",\"pr\":$PR}}"
